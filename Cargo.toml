[package]
name = "auto-renamer"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
globset = "0.4.20"
notify = "8"
regex = "1.13.1"
signal-hook = "0.4.4"
toml = "1.1.6"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
