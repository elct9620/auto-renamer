[workspace]
members = ["crates/*"]

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
toml = "1.1.6"

[package]
name = "auto-renamer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
auto-renamer-core = { path = "crates/core" }
chrono.workspace = true
notify = "8"
signal-hook = "0.4.4"

[dev-dependencies]
toml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

# The playground downloads its WebAssembly, so it is built for size rather than speed.
[profile.playground]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

