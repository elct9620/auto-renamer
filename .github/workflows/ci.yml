name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain and components come from rust-toolchain.toml.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Needs no Rust toolchain, so it stands apart from the build setup.
  spec:
    runs-on: ubuntu-latest
    env:
      # Pinned by hand: nothing watches a release asset fetched over curl.
      # The digest is pinned alongside the tag because an asset can be replaced.
      SUMI_VERSION: 0.1.0-preview10
      SUMI_SHA256: 8a5749dd80e9ae46e5005f2d14bcd2e69b3fa9537a606df0da97e55300a67efb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install sumi
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sumi.tar.gz" \
            "https://github.com/elct9620/sumitsubo/releases/download/v$SUMI_VERSION/sumi-$SUMI_VERSION-linux-x86_64.tar.gz"
          echo "$SUMI_SHA256  $RUNNER_TEMP/sumi.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/sumi.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: sumi verify
      - run: sumi fmt --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
