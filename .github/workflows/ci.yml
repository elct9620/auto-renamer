name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain and components come from rust-toolchain.toml.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Needs no Rust toolchain, so it stands apart from the build setup.
  spec:
    runs-on: ubuntu-latest
    env:
      # Pinned by hand: nothing watches a release asset fetched over curl.
      # The digest is pinned alongside the tag because an asset can be replaced.
      SUMI_VERSION: 0.1.0-preview10
      SUMI_SHA256: 8a5749dd80e9ae46e5005f2d14bcd2e69b3fa9537a606df0da97e55300a67efb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install sumi
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sumi.tar.gz" \
            "https://github.com/elct9620/sumitsubo/releases/download/v$SUMI_VERSION/sumi-$SUMI_VERSION-linux-x86_64.tar.gz"
          echo "$SUMI_SHA256  $RUNNER_TEMP/sumi.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/sumi.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: sumi verify
      - run: sumi fmt --check

  # Pull requests only build the image; a push to main publishes it as `latest` once the checks pass.
  # amd64 and arm64 build in parallel, each on a native runner (no QEMU).
  docker:
    needs: [check, spec]
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      packages: write
      id-token: write # sign provenance attestations and cache entries
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
