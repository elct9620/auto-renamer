[package]
name = "auto-renamer-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
auto-renamer-core = { path = "../core", features = ["serde"] }
chrono.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
toml.workspace = true

# The wasm-bindgen CLI that generates the JavaScript must be this exact version.
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.129"
